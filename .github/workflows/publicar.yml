# Publica el sitio en GitHub Pages cada vez que cambia main (solo si las pruebas pasan).
name: publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: Armar el sitio (solo archivos públicos)
        run: |
          mkdir -p _site
          cp -r index.html privacidad.html assets en _site/
          touch _site/.nojekyll
      # Requiere: Settings → Pages → Source: GitHub Actions (una vez, lo hace el dueño del repositorio).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
